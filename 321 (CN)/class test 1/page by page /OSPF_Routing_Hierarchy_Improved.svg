<svg width="600" height="350" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#fff"/>

  <!-- Backbone Area -->
  <ellipse cx="300" cy="100" rx="150" ry="45" fill="#e3f0ff" stroke="#2563eb" stroke-width="2"/>
  <text x="210" y="105" font-size="18" fill="#1e3a8a">Backbone Area (Area 0)</text>

  <!-- Area Border Routers (ABRs) -->
  <circle cx="170" cy="100" r="18" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="160" y="95" font-size="12" fill="#b45309">ABR</text>
  <circle cx="300" cy="100" r="18" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="290" y="95" font-size="12" fill="#b45309">ABR</text>
  <circle cx="430" cy="100" r="18" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="420" y="95" font-size="12" fill="#b45309">ABR</text>

  <!-- Lower Level Areas -->
  <ellipse cx="120" cy="250" rx="70" ry="35" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="90" y="255" font-size="16" fill="#065f46">Area 1</text>
  <ellipse cx="300" cy="250" rx="70" ry="35" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="270" y="255" font-size="16" fill="#065f46">Area 2</text>
  <ellipse cx="480" cy="250" rx="70" ry="35" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="450" y="255" font-size="16" fill="#065f46">Area 3</text>

  <!-- Connections (with arrows) -->
  <line x1="170" y1="118" x2="120" y2="215" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="118" x2="300" y2="215" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="430" y1="118" x2="480" y2="215" stroke="#b45309" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrowhead marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L3,5 Z" fill="#b45309" />
    </marker>
  </defs>
</svg>
