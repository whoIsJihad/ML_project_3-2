<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <style>
    .layer { rx:10; ry:10; stroke:#2d3748; stroke-width:1.6 }
    .title { font: 800 22px/1.2 'Helvetica Neue', Arial, sans-serif; fill:#0f172a }
    .label { font: 700 15px/1.2 'Helvetica Neue', Arial, sans-serif; fill:#0f172a }
    .small { font: 13px/1.2 'Helvetica Neue', Arial, sans-serif; fill:#1f2937 }
    .mono { font-family: 'Courier New', monospace; font-size:13px; fill:#0b1220 }
    .pdu { font: 700 14px 'Helvetica Neue', Arial, sans-serif; fill:#fff }
    .note { font: 12px/1.2 'Helvetica Neue', Arial, sans-serif; fill:#334155 }
    .arrow { stroke: #4b5563; stroke-width:2; fill:none; marker-end: url(#arrowhead) }
    .bg { fill: #ffffff }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4b5563" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="48" y="48" class="title">OSI Model — Annotated Overview</text>
  <text x="48" y="78" class="note">Example flow: Browser issues an HTTP GET → TCP → IP → Ethernet → physical bits</text>

  <!-- Layers column -->
  <!-- Layer boxes (vertical stack) -->
  <g transform="translate(48,110)">
    <!-- App -->
    <rect x="0" y="0" width="420" height="84" fill="#1e40af" class="layer" filter="url(#shadow)" />
    <text x="18" y="30" class="pdu">Application (Layer 7)</text>
    <text x="18" y="50" class="small">APDU — HTTP request (text)</text>
    <text x="18" y="70" class="mono">GET /index.html HTTP/1.1</text>

    <!-- Presentation -->
    <rect x="0" y="104" width="420" height="66" fill="#0ea5a1" class="layer" filter="url(#shadow)" />
    <text x="18" y="128" class="pdu">Presentation (Layer 6)</text>
    <text x="18" y="148" class="small">Encoding / Compression / TLS (if used)</text>

    <!-- Session -->
    <rect x="0" y="178" width="420" height="66" fill="#16a34a" class="layer" filter="url(#shadow)" />
    <text x="18" y="202" class="pdu">Session (Layer 5)</text>
    <text x="18" y="222" class="small">Session tokens, dialog control (often in app)</text>

    <!-- Transport -->
    <rect x="0" y="260" width="420" height="96" fill="#ea580c" class="layer" filter="url(#shadow)" />
    <text x="18" y="288" class="pdu">Transport (Layer 4)</text>
    <text x="18" y="308" class="small">TPDU — TCP segment / UDP datagram</text>
    <text x="18" y="328" class="mono">TCP: src=54321 → dst=80  (seq=1001)</text>

    <!-- Network -->
    <rect x="0" y="366" width="420" height="92" fill="#be185d" class="layer" filter="url(#shadow)" />
    <text x="18" y="394" class="pdu">Network (Layer 3)</text>
    <text x="18" y="414" class="small">Packet — IPv4 / IPv6</text>
    <text x="18" y="434" class="mono">IP: 192.0.2.10 → 93.184.216.34 (proto=TCP)</text>

    <!-- Data Link -->
    <rect x="0" y="466" width="420" height="92" fill="#7c3aed" class="layer" filter="url(#shadow)" />
    <text x="18" y="494" class="pdu">Data Link (Layer 2)</text>
    <text x="18" y="514" class="small">Frame — Ethernet II</text>
    <text x="18" y="534" class="mono">DstMAC: aa:bb:cc:dd:ee:ff</text>

    <!-- Physical -->
    <rect x="0" y="582" width="420" height="96" fill="#334155" class="layer" filter="url(#shadow)" />
    <text x="18" y="610" class="pdu">Physical (Layer 1)</text>
    <text x="18" y="632" class="small">Bits / Signals (electrical / optical / RF)</text>
    <text x="18" y="652" class="mono">01000111 01000101 01010100 ...</text>
  </g>

  <!-- Right-side: Expanded encapsulation / bytes -->
  <g transform="translate(520,110)">
    <rect x="0" y="0" width="820" height="760" rx="12" ry="12" fill="#ffffff" stroke="#e6eef7"/>
    <text x="26" y="36" class="label">Encapsulation (outer → inner) — example bytes/headers</text>

    <!-- Ethernet frame box -->
    <rect x="28" y="60" width="760" height="84" fill="#eef2ff" stroke="#b6d0ff" rx="8"/>
    <text x="46" y="92" class="small"><tspan font-weight="800">Ethernet II Frame</tspan> — DstMAC | SrcMAC | Ethertype (0x0800) | Payload (IP) | FCS</text>
    <text x="46" y="116" class="mono">aa:bb:cc:dd:ee:ff  11:22:33:44:55:66  0x0800  ... [IP packet] ...  CRC</text>

    <!-- IP packet box -->
    <rect x="28" y="168" width="760" height="116" fill="#fff7f3" stroke="#ffcec0" rx="8"/>
    <text x="46" y="200" class="small"><tspan font-weight="800">IPv4 Packet</tspan> — Ver/IHL | TOS | TotalLen | ID | Flags | TTL | Protocol | HeaderChk | SrcIP | DstIP</text>
    <text x="46" y="224" class="mono">0x45 ... Proto=6 (TCP)  Src=192.0.2.10  Dst=93.184.216.34</text>
    <text x="46" y="244" class="mono">Payload → [TCP segment (header + application bytes)]</text>

    <!-- TCP segment box -->
    <rect x="28" y="300" width="760" height="120" fill="#f3fff7" stroke="#c8f2d0" rx="8"/>
    <text x="46" y="328" class="small"><tspan font-weight="800">TCP Segment</tspan> — SrcPort | DstPort | Seq | Ack | Flags | Window | Checksum</text>
    <text x="46" y="352" class="mono">Src=54321  Dst=80  Seq=1001  Flags=PSH,ACK  Window=64240</text>
    <text x="46" y="372" class="mono">Payload → HTTP request bytes (ASCII)</text>

    <!-- HTTP payload box -->
    <rect x="28" y="436" width="760" height="140" fill="#fffdf0" stroke="#fff0b3" rx="8"/>
    <text x="46" y="466" class="small"><tspan font-weight="800">Application payload (HTTP)</tspan></text>
    <text x="46" y="494" class="mono">GET /index.html HTTP/1.1\r\nHost: example.com\r\nUser-Agent: ExampleClient/1.0\r\n\r\n</text>

    <!-- Physical / bits box -->
    <rect x="28" y="592" width="760" height="140" fill="#f8fafc" stroke="#e6eef7" rx="8"/>
    <text x="46" y="622" class="small"><tspan font-weight="800">Physical (encoded bits)</tspan></text>
    <text x="46" y="650" class="mono">ASCII 'G' = 0x47 = 01000111   ASCII 'E' = 0x45 = 01000101   ASCII 'T' = 0x54 = 01010100 ...</text>
    <text x="46" y="674" class="note">Physical encoding maps bits → symbols (e.g., MLT-3, Manchester, PAM). NIC/PHY handles this.</text>

  </g>

  <!-- Arrows linking left layers to right encapsulation -->
  <!-- arrows from left stack to encapsulation area (aligned with new layout) -->
  <path class="arrow" d="M468,128 L520,128" />
  <path class="arrow" d="M468,176 L520,188" />
  <path class="arrow" d="M468,236 L520,248" />
  <path class="arrow" d="M468,308 L520,320" />
  <path class="arrow" d="M468,410 L520,360" />
  <path class="arrow" d="M468,520 L520,640" />

  <!-- Legend / tips -->
  <g transform="translate(48,810)">
    <rect x="0" y="0" width="1292" height="120" rx="10" fill="#ffffff" stroke="#e6eef7"/>
    <text x="18" y="28" class="label">Legend & quick tips</text>
    <text x="18" y="56" class="small">- Use concrete examples (HTTP/TCP/IP/Ethernet) to see encapsulation.</text>
    <text x="18" y="80" class="small">- Presentation/Session usually live inside Application (TLS, codecs, cookies).</text>
    <text x="360" y="56" class="small">- PDUs: App → Transport (segment/datagram) → Network (packet) → Link (frame) → Physical (bits).</text>
    <text x="360" y="80" class="small">- Ask for a byte-level hexdump (I can add `HTTP_example_hexdump.md`).</text>
  </g>

</svg>