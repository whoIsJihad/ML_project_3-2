<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Softmax Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .bar-transition { transition: width 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-950 text-slate-50 font-sans p-4 md:p-8">
    <div class="max-w-2xl mx-auto space-y-8">
        <header>
            <h1 class="text-2xl font-bold text-sky-400">Softmax Logit Simulator</h1>
            <p class="text-slate-400 text-sm">Adjust the logits (raw scores) to see how they transform into probabilities.</p>
        </header>

        <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 space-y-6">
            <div id="logit-inputs" class="space-y-4">
                <!-- Inputs generated by JS -->
            </div>
        </div>

        <div class="bg-slate-900 p-6 rounded-xl border border-slate-800">
            <h2 class="text-lg font-semibold mb-4 text-sky-300">Output Probabilities (Softmax)</h2>
            <div id="output-bars" class="space-y-6">
                <!-- Bars generated by JS -->
            </div>
            <div class="mt-6 pt-4 border-t border-slate-800 flex justify-between text-sm text-slate-500">
                <span>Total Sum:</span>
                <span id="total-sum" class="font-mono text-sky-400">1.0000</span>
            </div>
        </div>
        
        <div class="text-xs text-slate-500 italic">
            Note: Notice how increasing a logit slightly exponentially increases its probability relative to others.
        </div>
    </div>

    <script>
        const classes = ['Cat', 'Dog', 'Chicken'];
        let logits = [2.0, 1.0, 0.1];

        function calculateSoftmax(arr) {
            const exponents = arr.map(z => Math.exp(z));
            const sumExponents = exponents.reduce((a, b) => a + b, 0);
            return exponents.map(e => e / sumExponents);
        }

        function updateUI() {
            const probabilities = calculateSoftmax(logits);
            const container = document.getElementById('output-bars');
            const inputContainer = document.getElementById('logit-inputs');
            
            // Render Inputs if first time
            if (inputContainer.innerHTML === "") {
                logits.forEach((val, i) => {
                    const div = document.createElement('div');
                    div.className = "flex items-center gap-4";
                    div.innerHTML = `
                        <label class="w-20 text-sm font-medium">${classes[i]}</label>
                        <input type="range" min="-5" max="5" step="0.1" value="${val}" 
                               class="flex-1 h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-sky-500"
                               oninput="updateLogit(${i}, this.value)">
                        <span class="w-12 text-right font-mono text-sm text-sky-400" id="logit-val-${i}">${val}</span>
                    `;
                    inputContainer.appendChild(div);
                });
            }

            // Update Bars and Probabilities
            container.innerHTML = "";
            probabilities.forEach((p, i) => {
                const percent = (p * 100).toFixed(2);
                const div = document.createElement('div');
                div.innerHTML = `
                    <div class="flex justify-between text-sm mb-1">
                        <span>${classes[i]}</span>
                        <span class="font-mono text-sky-400">${percent}%</span>
                    </div>
                    <div class="w-full bg-slate-800 rounded-full h-4 overflow-hidden">
                        <div class="bg-sky-500 h-full bar-transition" style="width: ${percent}%"></div>
                    </div>
                    <div class="text-[10px] text-slate-600 mt-1 font-mono">P = ${p.toFixed(4)}</div>
                `;
                container.appendChild(div);
            });

            document.getElementById('total-sum').innerText = probabilities.reduce((a, b) => a + b, 0).toFixed(4);
        }

        function updateLogit(index, val) {
            logits[index] = parseFloat(val);
            document.getElementById(`logit-val-${index}`).innerText = val;
            updateUI();
        }

        window.onload = updateUI;
    </script>
</body>
</html>
